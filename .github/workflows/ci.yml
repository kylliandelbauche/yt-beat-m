name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner manuel (Linux par défaut ; Mac si nécessaire)'
        required: true
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - macos-latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.9.14'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: desktop
      - name: Rust formatting and lockfile
        working-directory: desktop/src-tauri
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt
          cargo fmt --check
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      # The application remains a Mac-only prototype. Keep the automatic Checks
      # job on Ubuntu; a manual Mac run also validates the packaged desktop.
      - if: runner.os == 'macOS'
        run: |
          python3 scripts/desktop.py prepare
          cd desktop/src-tauri
          cargo fmt --check
          cargo clippy --locked -- -D warnings
          cargo test --locked
          cd ../..
          BEAT_M_TEST_ENGINE="$PWD/desktop/src-tauri/resources/engine/beat-m-engine" uv run --locked --group desktop pytest backend/tests/test_desktop.py
          npm --prefix desktop run build
