version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      frontend:
        patterns: ['*']
