[package]
name = "beat-m-desktop"
version = "0.1.2"
description = "Beat m desktop prototype"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opener = "0.8"

[profile.release]
strip = true
lto = "thin"
